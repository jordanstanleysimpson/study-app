<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1a5276"/>
    </marker>
    <marker id="arr-rain" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2980b9"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee1f9"/>
      <stop offset="100%" stop-color="#d6eeff"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="720" height="460" fill="url(#sky)"/>

  <!-- Ground / land mass -->
  <polygon points="0,460 0,240 90,160 180,220 280,280 720,280 720,460" fill="#a0785a"/>
  <!-- Green surface -->
  <polygon points="0,240 90,160 180,220 280,280 720,280 720,272 280,272 180,212 90,152 0,232" fill="#5a8a3a"/>

  <!-- Ocean on right -->
  <rect x="520" y="280" width="200" height="180" fill="#2980b9" opacity="0.9"/>
  <text x="620" y="380" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Ocean / Lake</text>
  <!-- water shimmer -->
  <line x1="535" y1="305" x2="700" y2="305" stroke="white" stroke-width="1.5" opacity="0.4"/>
  <line x1="535" y1="325" x2="700" y2="325" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="655" cy="60" r="38" fill="#f9ca24" stroke="#f0932b" stroke-width="2"/>
  <text x="655" y="65" text-anchor="middle" font-size="13" fill="#856404" font-weight="bold">SUN</text>
  <g stroke="#f9ca24" stroke-width="2.5" stroke-linecap="round">
    <line x1="655" y1="12" x2="655" y2="4"/>
    <line x1="693" y1="22" x2="699" y2="14"/>
    <line x1="706" y1="60" x2="714" y2="60"/>
    <line x1="693" y1="98" x2="699" y2="106"/>
    <line x1="617" y1="22" x2="611" y2="14"/>
    <line x1="604" y1="60" x2="596" y2="60"/>
  </g>

  <!-- Trees on hillside -->
  <g fill="#2e7d32">
    <polygon points="110,145 96,178 124,178"/>
    <polygon points="110,160 98,182 122,182"/>
    <rect x="107" y="182" width="6" height="18" fill="#6d4c41"/>
    <polygon points="155,200 141,230 169,230"/>
    <polygon points="155,215 143,234 167,234"/>
    <rect x="152" y="234" width="6" height="15" fill="#6d4c41"/>
    <polygon points="200,245 187,272 213,272"/>
    <polygon points="200,258 188,275 212,275"/>
    <rect x="197" y="275" width="6" height="5" fill="#6d4c41"/>
  </g>

  <!-- Cloud -->
  <g fill="white" stroke="#b0bec5" stroke-width="1">
    <ellipse cx="340" cy="100" rx="58" ry="36"/>
    <ellipse cx="298" cy="113" rx="38" ry="26"/>
    <ellipse cx="384" cy="113" rx="40" ry="26"/>
    <ellipse cx="340" cy="122" rx="52" ry="22"/>
  </g>
  <text x="340" y="105" text-anchor="middle" font-size="12" fill="#455a64" font-weight="bold">Cloud</text>
  <text x="340" y="119" text-anchor="middle" font-size="10" fill="#455a64">(Condensation)</text>

  <!-- EVAPORATION: ocean → cloud -->
  <path d="M 590,278 C 570,210 480,155 395,122" stroke="#1a5276" stroke-width="2.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="7,3"/>
  <text x="528" y="188" font-size="12" fill="#1a5276" font-weight="bold"
        transform="rotate(-48,528,188)">Evaporation</text>

  <!-- TRANSPIRATION: trees → cloud -->
  <path d="M 155,195 C 210,155 265,128 298,115" stroke="#1a5276" stroke-width="2.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="7,3"/>
  <text x="178" y="143" font-size="12" fill="#1a5276" font-weight="bold">Transpiration</text>

  <!-- PRECIPITATION: rain drops from cloud -->
  <g stroke="#2980b9" stroke-width="2.5" marker-end="url(#arr-rain)">
    <line x1="300" y1="134" x2="260" y2="220"/>
    <line x1="320" y1="136" x2="285" y2="222"/>
    <line x1="340" y1="138" x2="312" y2="224"/>
    <line x1="360" y1="136" x2="337" y2="222"/>
    <line x1="378" y1="133" x2="362" y2="219"/>
  </g>
  <text x="440" y="162" font-size="12" fill="#154360" font-weight="bold">Precipitation</text>
  <line x1="437" y1="164" x2="390" y2="175" stroke="#154360" stroke-width="1.2" stroke-dasharray="4,2"/>

  <!-- SURFACE RUNOFF: along ground toward ocean -->
  <path d="M 290,276 C 370,271 440,273 518,278" stroke="#1a5276" stroke-width="2.5" fill="none"
        marker-end="url(#arr)"/>
  <text x="400" y="266" text-anchor="middle" font-size="12" fill="#1a5276" font-weight="bold">Surface Runoff</text>

  <!-- INFILTRATION: down into ground -->
  <path d="M 245,280 L 245,350" stroke="#1a5276" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="178" y="330" font-size="12" fill="#1a5276" font-weight="bold">Infiltration</text>
  <line x1="238" y1="322" x2="178" y2="322" stroke="#1a5276" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- GROUNDWATER FLOW underground -->
  <rect x="60" y="355" width="455" height="3" fill="#aed6f1" opacity="0.5" rx="2"/>
  <path d="M 270,370 C 360,366 440,366 517,370" stroke="#2980b9" stroke-width="2.5" fill="none"
        marker-end="url(#arr-rain)" stroke-dasharray="9,4"/>
  <text x="390" y="400" text-anchor="middle" font-size="12" fill="#154360" font-weight="bold">Groundwater Flow</text>

  <!-- Title -->
  <rect x="0" y="430" width="720" height="30" fill="#1a5276" opacity="0.85"/>
  <text x="360" y="450" text-anchor="middle" font-size="15" fill="white" font-weight="bold">
    The Water Cycle (Hydrologic Cycle)
  </text>
</svg>
