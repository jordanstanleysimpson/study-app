<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1a5276"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1e8449"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee1f9"/>
      <stop offset="100%" stop-color="#d6eeff"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="720" height="500" fill="url(#sky)"/>

  <!-- Ground layer -->
  <rect x="0" y="340" width="720" height="80" fill="#5a8a3a"/>
  <!-- Soil layer -->
  <rect x="0" y="420" width="720" height="80" fill="#8B6914"/>

  <!-- Underground / rock layer -->
  <rect x="0" y="450" width="720" height="50" fill="#5D4037"/>

  <!-- === ATMOSPHERE BOX === -->
  <rect x="220" y="20" width="280" height="70" rx="10" fill="white" stroke="#5dade2" stroke-width="2.5" opacity="0.92"/>
  <text x="360" y="45" text-anchor="middle" font-size="14" fill="#1a5276" font-weight="bold">ATMOSPHERE</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#5dade2">CO₂ in the air</text>
  <text x="360" y="78" text-anchor="middle" font-size="10" fill="#7f8c8d">(Carbon reservoir)</text>

  <!-- === PLANTS (left) === -->
  <g fill="#2e7d32">
    <polygon points="130,290 114,325 146,325"/>
    <polygon points="130,308 116,330 144,330"/>
    <rect x="127" y="330" width="6" height="18" fill="#6d4c41"/>
    <polygon points="100,295 86,325 114,325"/>
    <polygon points="100,310 87,328 113,328"/>
    <rect x="97" y="328" width="5" height="15" fill="#6d4c41"/>
  </g>
  <rect x="65" y="270" width="120" height="35" rx="6" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5" opacity="0.9"/>
  <text x="125" y="283" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">PLANTS</text>
  <text x="125" y="297" text-anchor="middle" font-size="10" fill="#1e8449">(Biosphere)</text>

  <!-- === ANIMALS (center-left) === -->
  <rect x="60" y="165" width="110" height="35" rx="6" fill="#fad7a0" stroke="#d68910" stroke-width="1.5" opacity="0.9"/>
  <text x="115" y="179" text-anchor="middle" font-size="12" fill="#784212" font-weight="bold">ANIMALS</text>
  <text x="115" y="193" text-anchor="middle" font-size="10" fill="#784212">(Biosphere)</text>

  <!-- === OCEAN (right) === -->
  <rect x="545" y="260" width="140" height="100" rx="6" fill="#2980b9" opacity="0.85"/>
  <text x="615" y="305" text-anchor="middle" font-size="13" fill="white" font-weight="bold">OCEAN</text>
  <text x="615" y="322" text-anchor="middle" font-size="10" fill="#d6eaf8">Dissolves CO₂</text>
  <text x="615" y="338" text-anchor="middle" font-size="10" fill="#d6eaf8">(Carbon sink)</text>
  <!-- water shimmer lines -->
  <line x1="555" y1="280" x2="680" y2="280" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="555" y1="295" x2="680" y2="295" stroke="white" stroke-width="1" opacity="0.2"/>

  <!-- === FOSSIL FUELS (underground) === -->
  <rect x="230" y="455" width="160" height="35" rx="6" fill="#212121" stroke="#f39c12" stroke-width="2" opacity="0.9"/>
  <text x="310" y="469" text-anchor="middle" font-size="12" fill="#f39c12" font-weight="bold">FOSSIL FUELS</text>
  <text x="310" y="483" text-anchor="middle" font-size="10" fill="#f9ca24">(Coal, Oil, Gas)</text>

  <!-- === DECOMPOSERS (bottom center) === -->
  <rect x="430" y="430" width="130" height="35" rx="6" fill="#7d6608" stroke="#d4ac0d" stroke-width="1.5" opacity="0.9"/>
  <text x="495" y="444" text-anchor="middle" font-size="11" fill="#f9e79f" font-weight="bold">DECOMPOSERS</text>
  <text x="495" y="458" text-anchor="middle" font-size="9" fill="#f9e79f">(Bacteria/Fungi)</text>

  <!-- ============ ARROWS ============ -->

  <!-- PHOTOSYNTHESIS: atmosphere CO2 → plants (green, down-left) -->
  <path d="M 285,88 C 240,150 185,220 165,268" stroke="#1e8449" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="195" y="185" text-anchor="middle" font-size="11" fill="#1e8449" font-weight="bold" transform="rotate(-65,195,185)">Photosynthesis</text>

  <!-- RESPIRATION: plants → atmosphere CO2 (red, up-right) -->
  <path d="M 175,268 C 210,210 255,140 270,90" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="245" y="188" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold" transform="rotate(-72,245,188)">Respiration</text>

  <!-- RESPIRATION: animals → atmosphere (red, up) -->
  <path d="M 155,165 C 200,130 255,108 282,90" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr-red)" stroke-dasharray="7,3"/>
  <text x="205" y="118" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Respiration</text>

  <!-- EATING: plants → animals (up arrow left side) -->
  <path d="M 125,265 C 120,238 118,215 115,200" stroke="#1a5276" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="98" y="235" text-anchor="middle" font-size="10" fill="#1a5276" font-weight="bold">Eaten</text>

  <!-- DECOMPOSITION: dead matter → atmosphere (up, dashed orange) -->
  <path d="M 470,428 C 460,380 430,310 415,90" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="8,4"/>
  <text x="460" y="300" text-anchor="middle" font-size="10" fill="#e67e22" font-weight="bold" transform="rotate(85,460,300)">Decomposition → CO₂</text>

  <!-- OCEAN ABSORBS CO2: atmosphere → ocean (right, blue) -->
  <path d="M 500,60 C 560,80 600,180 615,258" stroke="#2980b9" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="585" y="150" text-anchor="middle" font-size="10" fill="#2980b9" font-weight="bold" transform="rotate(75,585,150)">CO₂ dissolved</text>

  <!-- COMBUSTION: fossil fuels → atmosphere (up, red thick) -->
  <path d="M 310,453 C 320,380 340,220 345,92" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-red)"/>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">Combustion</text>
  <text x="360" y="294" text-anchor="middle" font-size="10" fill="#c0392b">(Burning)</text>

  <!-- VOLCANIC: small label at rock -->
  <text x="145" y="468" font-size="10" fill="#f39c12" font-weight="bold">🌋 Volcanic outgassing → CO₂</text>

  <!-- Title -->
  <rect x="0" y="470" width="720" height="30" fill="#1a5276" opacity="0.85"/>
  <text x="360" y="490" text-anchor="middle" font-size="14" fill="white" font-weight="bold">The Carbon Cycle</text>
</svg>
