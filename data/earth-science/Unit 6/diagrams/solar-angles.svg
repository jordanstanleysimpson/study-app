<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#e67e22"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee1f9"/>
      <stop offset="100%" stop-color="#d6eeff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="460" fill="url(#sky)"/>

  <!-- Ground -->
  <rect x="0" y="360" width="720" height="100" fill="#5a8a3a"/>
  <rect x="0" y="380" width="720" height="80" fill="#8B6914"/>

  <!-- Sun (top center) -->
  <circle cx="360" cy="50" r="35" fill="#f9ca24" stroke="#f0932b" stroke-width="2"/>
  <text x="360" y="55" text-anchor="middle" font-size="13" fill="#856404" font-weight="bold">SUN</text>
  <g stroke="#f9ca24" stroke-width="2.5" stroke-linecap="round">
    <line x1="360" y1="7" x2="360" y2="0"/>
    <line x1="395" y1="15" x2="400" y2="8"/>
    <line x1="325" y1="15" x2="320" y2="8"/>
    <line x1="408" y1="40" x2="415" y2="38"/>
    <line x1="312" y1="40" x2="305" y2="38"/>
  </g>

  <!-- LEFT SIDE: High angle (equator) -->
  <!-- Sun rays hitting at steep angle -->
  <line x1="290" y1="85" x2="170" y2="355" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="305" y1="85" x2="195" y2="355" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="85" x2="215" y2="355" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Small spread arc at ground -->
  <line x1="165" y1="360" x2="220" y2="360" stroke="#e74c3c" stroke-width="5"/>
  <text x="192" y="350" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">SMALL AREA</text>
  <text x="192" y="405" text-anchor="middle" font-size="13" fill="white" font-weight="bold">HIGH ANGLE</text>
  <text x="192" y="422" text-anchor="middle" font-size="11" fill="#f0f0f0">(Equator / Summer)</text>
  <text x="192" y="438" text-anchor="middle" font-size="12" fill="#ffeb3b" font-weight="bold">MORE INTENSE HEAT</text>

  <!-- Label: direct/concentrated -->
  <rect x="100" y="190" width="145" height="40" rx="6" fill="white" opacity="0.85"/>
  <text x="172" y="207" text-anchor="middle" font-size="11" fill="#1a5276" font-weight="bold">Direct / Concentrated</text>
  <text x="172" y="222" text-anchor="middle" font-size="10" fill="#1a5276">Same energy, small area</text>

  <!-- RIGHT SIDE: Low angle (poles) -->
  <line x1="430" y1="85" x2="480" y2="358" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="8,3"/>
  <line x1="445" y1="85" x2="510" y2="358" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="8,3"/>
  <line x1="460" y1="85" x2="540" y2="358" stroke="#e67e22" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="8,3"/>

  <!-- Large spread arc at ground -->
  <line x1="476" y1="360" x2="545" y2="360" stroke="#3498db" stroke-width="5"/>
  <text x="512" y="350" text-anchor="middle" font-size="11" fill="#2980b9" font-weight="bold">LARGE AREA</text>
  <text x="512" y="405" text-anchor="middle" font-size="13" fill="white" font-weight="bold">LOW ANGLE</text>
  <text x="512" y="422" text-anchor="middle" font-size="11" fill="#f0f0f0">(Poles / Winter)</text>
  <text x="512" y="438" text-anchor="middle" font-size="12" fill="#b3e5fc" font-weight="bold">LESS INTENSE HEAT</text>

  <!-- Label: spread/diluted -->
  <rect x="475" y="190" width="145" height="40" rx="6" fill="white" opacity="0.85"/>
  <text x="547" y="207" text-anchor="middle" font-size="11" fill="#1a5276" font-weight="bold">Angled / Spread Out</text>
  <text x="547" y="222" text-anchor="middle" font-size="10" fill="#1a5276">Same energy, large area</text>

  <!-- Divider line -->
  <line x1="360" y1="100" x2="360" y2="355" stroke="#666" stroke-width="1" stroke-dasharray="5,4" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="0" fill="none"/>
  <rect x="0" y="430" width="720" height="30" fill="#1a5276" opacity="0.85"/>
  <text x="360" y="450" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Solar Angle and Energy Intensity</text>
</svg>
